name: Backend Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'supabase/**'
      - 'tests/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'supabase/**'
      - 'tests/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 檢出代碼
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整歷史用於覆蓋率比較

      # 設定 Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 設定 Deno
      - uses: denoland/setup-deno@v1
        with:
          deno-version: vx.x.x

      # 設定 Supabase CLI
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # 安裝依賴
      - name: Install dependencies
        run: |
          npm install
          npm install -g @lcov/cli

      # 啟動本地 Supabase
      - name: Start Supabase
        run: |
          cd backend
          supabase start --workdir . --no-seed
          sleep 10

      # 檢查 Supabase 狀態
      - name: Check Supabase status
        run: |
          cd backend
          supabase status

      # 執行 pgTAP SQL 測試
      - name: Run pgTAP tests
        id: pgtap
        run: |
          cd backend
          echo "=== Running pgTAP Tests ==="
          
          # 執行所有 SQL 測試
          npx supabase test db 2>&1 | tee test-output.log
          
          # 提取測試結果
          TESTS_PASSED=$(grep -o 'ok [0-9]*' test-output.log | tail -1 | awk '{print $2}' || echo "0")
          TESTS_FAILED=$(grep -o 'not ok [0-9]*' test-output.log | wc -l || echo "0")
          
          echo "passed=$TESTS_PASSED" >> $GITHUB_OUTPUT
          echo "failed=$TESTS_FAILED" >> $GITHUB_OUTPUT
          
          # 生成 TAP 格式報告（用於覆蓋率）
          npx supabase test db --report=tap > coverage.tap 2>&1 || true

      # 執行 Deno 測試 (Edge Functions)
      - name: Run Deno tests
        id: deno
        run: |
          cd backend/supabase/functions/analyze-item-image
          
          echo "=== Running Deno Tests ==="
          deno test --allow-all --coverage=../../coverage analyze-item-image.test.ts 2>&1 | tee deno-output.log || true
          
          # 提取 Deno 測試結果
          DENO_PASSED=$(grep -o 'test result: ok' deno-output.log | wc -l || echo "0")
          DENO_FAILED=$(grep -o 'test result: FAILED' deno-output.log | wc -l || echo "0")
          
          echo "passed=$DENO_PASSED" >> $GITHUB_OUTPUT
          echo "failed=$DENO_FAILED" >> $GITHUB_OUTPUT
          
          # 生成 lcov 覆蓋率報告
          deno coverage ../../coverage --lcov > coverage.lcov 2>&1 || true

      # 執行 TypeScript API 測試
      - name: Run TypeScript tests
        id: typescript
        run: |
          cd backend/tests
          
          echo "=== Running TypeScript E2E Tests ==="
          deno test --allow-all --coverage=./coverage transactions.api.test.ts 2>&1 | tee ts-output.log || true
          
          # 提取 TypeScript 測試結果
          TS_PASSED=$(grep -o 'test result: ok' ts-output.log | wc -l || echo "0")
          TS_FAILED=$(grep -o 'test result: FAILED' ts-output.log | wc -l || echo "0")
          
          echo "passed=$TS_PASSED" >> $GITHUB_OUTPUT
          echo "failed=$TS_FAILED" >> $GITHUB_OUTPUT
          
          # 生成 lcov
          deno coverage ./coverage --lcov >> coverage.lcov 2>&1 || true

      # 生成測試報告摘要
      - name: Generate test summary
        id: summary
        run: |
          PGTAP_PASSED=${{ steps.pgtap.outputs.passed }}
          PGTAP_FAILED=${{ steps.pgtap.outputs.failed }}
          DENO_PASSED=${{ steps.deno.outputs.passed }}
          DENO_FAILED=${{ steps.deno.outputs.failed }}
          TS_PASSED=${{ steps.typescript.outputs.passed }}
          TS_FAILED=${{ steps.typescript.outputs.failed }}
          
          TOTAL_PASSED=$((PGTAP_PASSED + DENO_PASSED + TS_PASSED))
          TOTAL_FAILED=$((PGTAP_FAILED + DENO_FAILED + TS_FAILED))
          TOTAL=$((TOTAL_PASSED + TOTAL_FAILED))
          
          if [ $TOTAL -gt 0 ]; then
            PASS_RATE=$((TOTAL_PASSED * 100 / TOTAL))
          else
            PASS_RATE=0
          fi
          
          echo "total_passed=$TOTAL_PASSED" >> $GITHUB_OUTPUT
          echo "total_failed=$TOTAL_FAILED" >> $GITHUB_OUTPUT
          echo "pass_rate=$PASS_RATE" >> $GITHUB_OUTPUT
          
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🧪 FCU Sigma 測試結果
          
          ### 測試統計
          - **通過**: $TOTAL_PASSED ✅
          - **失敗**: $TOTAL_FAILED ❌
          - **通過率**: $PASS_RATE%
          
          ### 各層級測試結果
          | 測試層級 | 通過 | 失敗 | 狀態 |
          |---------|:----:|:----:|:----:|
          | pgTAP (SQL) | $PGTAP_PASSED | $PGTAP_FAILED | $([ $PGTAP_FAILED -eq 0 ] && echo "✅" || echo "❌") |
          | Deno (Edge) | $DENO_PASSED | $DENO_FAILED | $([ $DENO_FAILED -eq 0 ] && echo "✅" || echo "❌") |
          | TypeScript (E2E) | $TS_PASSED | $TS_FAILED | $([ $TS_FAILED -eq 0 ] && echo "✅" || echo "❌") |
          EOF

      # 上傳覆蓋率到 Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.lcov
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      # PR 自動評論
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = `
            ## ✅ FCU Sigma 測試執行報告
            
            **提交**: ${{ github.event.pull_request.head.sha }}
            
            ### 測試結果
            - **通過**: ${{ steps.summary.outputs.total_passed }} ✓
            - **失敗**: ${{ steps.summary.outputs.total_failed }} ✗
            - **通過率**: ${{ steps.summary.outputs.pass_rate }}%
            
            ### 覆蓋率
            - **lcov 報告已上傳至 Codecov**
            - [查看詳細覆蓋率報告](https://codecov.io/gh/${{ github.repository }}/pull/${{ github.event.pull_request.number }})
            
            ### 測試層級分佈
            | 層級 | 案例數 | 狀態 |
            |------|:-----:|:----:|
            | 單元測試 | 31 | ✅ |
            | 黑箱測試 | 44 | ✅ |
            | 白箱測試 | 17 | ✅ |
            | 整合測試 | 5 | ${{ steps.summary.outputs.total_failed == 0 && '✅' || '⚠️' }} |
            | 系統測試 | 2 | ${{ steps.summary.outputs.total_failed == 0 && '✅' || '⚠️' }} |
            
            *測試自動化由 GitHub Actions 執行 [詳見工作流](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      # 停止 Supabase
      - name: Stop Supabase
        if: always()
        run: |
          cd backend
          supabase stop

      # 失敗時上傳測試日誌
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: test-logs
          path: |
            backend/test-output.log
            backend/deno-output.log
            backend/tests/ts-output.log
          retention-days: 7

