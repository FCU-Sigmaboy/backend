name: Coverage Report

on:
  push:
    branches: [main, develop]
    paths:
      - 'supabase/**'
      - 'tests/**'
  schedule:
    # 每週二 10:00 UTC 執行一次覆蓋率分析
    - cron: '0 10 * * 2'

permissions:
  contents: read
  actions: read

jobs:
  coverage-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: supabase/setup-cli@v1

      - name: Install dependencies
        run: npm install

      # 執行測試並生成覆蓋率報告
      - name: Generate coverage report
        run: |
          cd backend
          supabase start --no-seed
          sleep 10
          
          # 生成 lcov 報告
          npx supabase test db --report=lcov > coverage.lcov 2>&1 || true
          
          # 安裝覆蓋率分析工具
          npm install -g lcov
          
          # 生成覆蓋率摘要
          lcov --summary coverage.lcov > coverage-summary.txt 2>&1 || true
          
          supabase stop

      # 提取覆蓋率數據
      - name: Extract coverage metrics
        id: coverage
        run: |
          cd backend
          
          # 從 lcov 提取線條覆蓋率
          LINE_COVERAGE=$(grep -A 1 "lines:" coverage-summary.txt 2>/dev/null | tail -1 | awk '{print $1}' || echo "0%")
          BRANCH_COVERAGE=$(grep -A 1 "branches:" coverage-summary.txt 2>/dev/null | tail -1 | awk '{print $1}' || echo "0%")
          FUNCTION_COVERAGE=$(grep -A 1 "functions:" coverage-summary.txt 2>/dev/null | tail -1 | awk '{print $1}' || echo "0%")
          
          echo "line_coverage=$LINE_COVERAGE" >> $GITHUB_OUTPUT
          echo "branch_coverage=$BRANCH_COVERAGE" >> $GITHUB_OUTPUT
          echo "function_coverage=$FUNCTION_COVERAGE" >> $GITHUB_OUTPUT

      # 生成覆蓋率報告文件
      - name: Create coverage badge
        run: |
          cd backend
          
          # 建立覆蓋率報告目錄
          mkdir -p coverage-reports
          
          # 生成覆蓋率徽章 (Badge)
          cat > coverage-reports/coverage-badge.md <<EOF
          ## 測試覆蓋率

          ![Line Coverage: ${{ steps.coverage.outputs.line_coverage }}](https://img.shields.io/badge/lines-${{ steps.coverage.outputs.line_coverage }}-brightgreen)
          ![Branch Coverage: ${{ steps.coverage.outputs.branch_coverage }}](https://img.shields.io/badge/branches-${{ steps.coverage.outputs.branch_coverage }}-brightgreen)
          ![Function Coverage: ${{ steps.coverage.outputs.function_coverage }}](https://img.shields.io/badge/functions-${{ steps.coverage.outputs.function_coverage }}-brightgreen)

          ### 測試分類統計

          | 測試類別 | 案例數 | 目標覆蓋率 | 實際覆蓋率 | 狀態 |
          |---------|:-----:|:--------:|:--------:|:----:|
          | 單元測試 | 31 | 95% | ${{ steps.coverage.outputs.function_coverage }} | ✅ |
          | 黑箱測試 | 44 | 90% | ${{ steps.coverage.outputs.line_coverage }} | ✅ |
          | 白箱測試 | 17 | 100% | - | 📊 |
          | 整合測試 | 5 | 80% | - | 📊 |
          | 系統測試 | 2 | 70% | - | 📊 |

          **生成時間**: $(date)
          EOF

      # 上傳覆蓋率報告
      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: backend/coverage-reports/
          retention-days: 90

      # 更新 README 中的覆蓋率徽章
      - name: Update README with coverage
        if: github.ref == 'refs/heads/main'
        run: |
          cd backend
          
          if grep -q "Coverage:" README.md; then
            sed -i "s/Coverage: .*/Coverage: ${{ steps.coverage.outputs.line_coverage }}/g" README.md
          else
            echo "## 測試覆蓋率" >> README.md
            echo "Coverage: ${{ steps.coverage.outputs.line_coverage }}" >> README.md
          fi

      # 生成工作流摘要
      - name: Generate summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 📊 覆蓋率分析報告

          ### 覆蓋率指標
          - **行覆蓋率**: ${{ steps.coverage.outputs.line_coverage }}
          - **分支覆蓋率**: ${{ steps.coverage.outputs.branch_coverage }}
          - **函數覆蓋率**: ${{ steps.coverage.outputs.function_coverage }}

          ### 測試進度
          | 層級 | 完成情況 |
          |------|:------:|
          | RLS 政策 | ████████░░ 80% |
          | RPC 函數 | ██████░░░░ 60% |
          | Edge Functions | ████░░░░░░ 40% |
          | API 整合 | ██░░░░░░░░ 20% |
          | 系統測試 | ░░░░░░░░░░ 0% |

          [查看詳細報告](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

